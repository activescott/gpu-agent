summary: >-
  The AMD Instinct MI350P is the PCIe variant of AMD's CDNA 4 architecture AI
  and HPC datacenter accelerator family, announced on May 7, 2026. It is not a
  binned or cut-down MI350X: AMD built a smaller purpose-designed CDNA 4
  package for it, pairing a single I/O die with 4 Accelerator Complex Dies
  (XCDs) instead of the MI350X's 2 I/O dies carrying 8 XCDs. That yields 128
  compute units, 8,192 stream processors, and 512 Matrix Cores at a 2,200 MHz
  peak engine clock, with 73 billion transistors and 128 MB of LLC. The MI350P delivers 72 TFLOPS of FP32
  vector and matrix performance, 36 TFLOPS of FP64 vector performance, 1.15
  PFLOPS of dense FP16/BF16 matrix performance (2.3 PFLOPS with 2:4 structured
  sparsity), 2.3 POPS of dense INT8 matrix performance, 2.3 PFLOPS of dense
  OCP-FP8 matrix performance, and 4.6 PFLOPS of MXFP4 microscaling performance.
  It carries 144 GB of HBM3E memory via a 4,096-bit interface at 4 TB/s (4,000
  GB/s) of peak bandwidth. Unlike the OAM-based MI350X, the MI350P uses a
  full-height full-length dual-slot PCIe 5.0 x16 card form factor with passive
  air cooling at 600W maximum TBP (450W configurable), designed for drop-in
  deployment in existing enterprise rack servers without liquid cooling or a
  Universal Base Board. AMD does not expose the GPU-to-GPU Infinity Fabric
  links on the MI350P, so multi-GPU scaling goes over the PCIe Gen5 x16 link.

