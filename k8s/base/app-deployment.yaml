apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  # Codifies the effective default (25%/25% on 1 replica rounds to surge=1,
  # unavailable=0): a rollout always surges a new pod and keeps the old one until
  # the new pod is Ready. NOTE: this protects the rollout window only, not a
  # running single replica that later crash-loops (see
  # home-infra-k8s-flux docs/specs/gpupoet-app-rollout-availability/spec.md).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.activescott.com/component: app
    spec:
      containers:
        - name: app
          # NOTE: this image is replaced with an images transformer in the overlay
          image: gpupoet-image-app

          # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.6"
              memory: "0.6Gi"

          ports:
            - containerPort: 3000

          env:
            - name: POSTGRES_PRISMA_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: POSTGRES_PRISMA_URL

            - name: POSTGRES_URL_NON_POOLING
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: POSTGRES_URL_NON_POOLING

            - name: PUBLIC_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: PUBLIC_DOMAIN

            - name: PUBLIC_POSTHOG_HOST
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: PUBLIC_POSTHOG_HOST

            - name: PUBLIC_POSTHOG_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: PUBLIC_POSTHOG_KEY

            - name: EBAY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: EBAY_ENVIRONMENT

            - name: EBAY_AFFILIATE_CAMPAIGN_ID
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: EBAY_AFFILIATE_CAMPAIGN_ID

            - name: EBAY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: EBAY_CLIENT_ID

            - name: EBAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: EBAY_CLIENT_SECRET

            - name: INDEXNOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: INDEXNOW_API_KEY

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: ADMIN_PASSWORD

            - name: AMAZON_SEARCHER_URL
              value: "http://amazon-searcher:3001"

            - name: AMAZON_AFFILIATE_TAG
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: AMAZON_AFFILIATE_TAG
                  optional: true

          # Gates liveness/readiness until the app is genuinely up. The container
          # runs a Prisma DB seed before `next start` binds :3000; without this,
          # a slow boot trips the liveness probe and crash-loops (incident
          # 2026-08-02). ~5 min budget (10s x 30).
          startupProbe:
            httpGet:
              path: /api/health/readiness
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: 3000
            # startupProbe handles the slow cold start, so no initialDelay here.
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: 3000
            # Tolerant on purpose: an already-serving pod must survive a GC pause
            # or brief event-loop block. The default timeoutSeconds:1 killed a
            # healthy pod on 2026-08-02. startupProbe gates the initial delay.
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
