notes:
  - FP32 TFLOPS calculated as 1,792 stream processors × 2,491 MHz boost clock × 2 ops/cycle / 1,000,000 = 8.93 TFLOPS
  - FP16 performance is 17.86 TFLOPS calculated at 2:1 ratio to FP32, which is standard for RDNA 2 architecture
  - Memory bandwidth of 224 GB/s calculated as 128-bit bus × 14 Gbps effective / 8
  - RDNA 2 architecture does not include dedicated AI accelerators or tensor cores (added in RDNA 3), so tensorCoreCount is null
  - 'supportedHardwareOperations is an empty array: RDNA 2 has no matrix/tensor-core (GEMM-accelerated) hardware path of any kind. Per AMD''s own RDNA architecture technology page, the generational feature-comparison table''s "AI Accelerators" row is blank for both the "RDNA" and "RDNA 2" columns and first shows "1st Gen" at "RDNA 3" -- confirmed independently by Wikipedia''s RDNA 2 article, which makes no mention of AI accelerators or matrix-multiply hardware. RDNA 2''s ray accelerator is a distinct fixed-function ray-intersection unit, unrelated to matrix/GEMM support. Sources: https://www.amd.com/en/technologies/rdna.html, https://en.wikipedia.org/wiki/RDNA_2'
  - 'fp8TFLOPS and fp4TFLOPS are left null and intentionally NOT listed in unverifiedSpecs: this is a confirmed hardware negative rather than a research gap. RDNA 2 predates AMD''s AI Accelerators/WMMA matrix engines entirely (introduced in RDNA 3), so no FP8 or FP4 matrix throughput exists on this architecture to report.'
  - 'RDNA 2 CUs execute INT8 and INT4 operations via standard ALU/dot-product instructions, not a dedicated matrix or tensor core -- RDNA 2 predates AMD''s AI Accelerators (WMMA), which were introduced in RDNA 3. AMD does not publish INT8 TOPS for consumer RDNA 2 GPUs, so int8TOPS is null. Sources: https://en.wikipedia.org/wiki/RDNA_2, https://www.amd.com/en/technologies/rdna.html'
  - The 32MB Infinity Cache significantly improves effective memory bandwidth beyond the raw 224 GB/s specification
  - Built on TSMC 7nm process with 237 mm² die size containing 11.06 billion transistors
  - Uses the Navi 23 XL die with 4 compute units disabled compared to the RX 6600 XT
  - Uses PCIe 4.0 x8 interface instead of x16
  - MSRP of $329 USD verified from multiple sources including Tom's Hardware, AnandTech, and GSMArena at launch on October 13, 2021
