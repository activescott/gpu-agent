apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: gpupoet-dev

build:
  # https://skaffold.dev/docs/references/yaml/#build
  # inputDigest tags images by build-input content, not the default gitCommit
  # tagger. With per-worktree dev instances sharing one Docker daemon, two
  # dirty worktrees at the same commit would both tag
  # gpupoet-dev:<commit>-dirty and race each other; content digests make an
  # equal tag imply equal content, so collisions are benign.
  tagPolicy:
    inputDigest: {}
  local:
    # No registry push; skaffold auto-detects the local kind cluster from
    # the `kind-*` kubecontext prefix and loads built images into the kind
    # nodes via `kind load docker-image`. No docker-env eval needed.
    push: false
    useBuildkit: true
  artifacts:
    - image: gpupoet-dev
      # Build from repository root (monorepo with workspace dependencies)
      context: .
      docker:
        dockerfile: Dockerfile.dev
      sync:
        # sync guide: https://skaffold.dev/docs/filesync/
        # sync ref: https://skaffold.dev/docs/references/yaml/#build-artifacts-sync
        manual:
          # Web app sources
          - src: "packages/web-app/src/**/*"
            dest: /app/
          - src: "packages/web-app/public/**/*"
            dest: /app/
          # Prisma schema and migrations
          - src: "packages/web-app/prisma/schema.prisma"
            dest: /app/
          - src: "packages/web-app/prisma/migrations/**/*"
            dest: /app/
          # ebay-client package sources
          - src: "packages/ebay-client/src/**/*"
            dest: /app/
          # filter-items package sources
          - src: "packages/filter-items/src/**/*"
            dest: /app/
          # Data directory
          - src: "data/benchmark-data/**/*"
            dest: /app/
          - src: "data/gpu-data/**/*"
            dest: /app/
          - src: "data/model-data/**/*"
            dest: /app/
          - src: "data/news-data/**/*"
            dest: /app/
          - src: "data/metric-definitions/**/*"
            dest: /app/
    - image: amazon-searcher-dev
      context: ../amazon-searcher
      docker:
        dockerfile: Dockerfile
manifests:
  kustomize:
    paths:
      # Generated by scripts/dev (gitignored): layers this checkout's dev
      # instance namespace + hostname over k8s/overlays/dev. Run scripts/dev
      # rather than invoking skaffold directly.
      - k8s/overlays/dev-instance

deploy:
  # Force skaffold to use the shared local kind cluster (default cluster name
  # 'kind' → kubectl context 'kind-kind'). Other projects may share this
  # cluster; gpu-poet stays isolated in the gpupoet-dev namespace.
  kubeContext: kind-kind
  kubectl:
    # No defaultNamespace: skaffold passes it as kubectl's --namespace, and
    # kubectl rejects an apply whose objects carry a different explicit
    # namespace. Every rendered resource gets its namespace from the
    # generated overlay's namespace transformer (gpupoet-dev for the main
    # checkout, gpupoet-dev-<name> for a worktree instance).
    # Server-side apply flags for more reliable resource management
    # --force-conflicts: Resolves field manager conflicts when re-applying resources
    #   (allows Skaffold to take ownership even if another tool like kubectl previously applied)
    # --server-side: Uses server-side apply instead of client-side
    #   (more reliable for managing resource ownership and prevents conflicts)
    flags:
      apply:
        - --force-conflicts
        - --server-side

# No app portForward on purpose: skaffold's --port-forward is kubectl
# port-forward, whose tunnel dropped connections under sustained load in
# other projects on this same pattern. Traffic goes through ingress-nginx
# instead, published on host port 3400 by k8s/kind-cluster.yaml — also
# closer to how production serves the app. scripts/dev prints the URL
# (http://gpupoet.localhost:3400 for the main checkout).
#
# amazon-searcher has no ingress route (it's an internal-only sidecar the
# app calls over the cluster network) — port-forwarded here purely so it can
# be curled directly for local debugging.
portForward:
  - resourceType: service
    resourceName: amazon-searcher
    namespace: gpupoet-dev
    port: 3001
    localPort: 3001
