notes:
  - tensorCoreCount tracks the 2nd-generation AI Accelerators as "tensor cores". The RX 9070 XT has 128 AI Accelerators (2 per CU × 64 CUs).
  - fp32TFLOPS of 48.7 calculated based on 4,096 stream processors × 2.97 GHz boost clock × 2 (dual-issue) = 48.66 TFLOPS, rounded to 48.7 TFLOPS as reported by AMD.
  - 'fp16TFLOPS of 194.8 represents FP16 Matrix throughput (dense) via the 2nd-generation AI Accelerators (WMMA), per AMD product page convention (Peak Half Precision (FP16 Matrix) Performance). RDNA 4 matrix throughput is 4x FP32 vector (verified against AMD-published values for RX 9070=145, RX 9060=86, RX 9070 GRE=137). AMD also publishes FP16 Vector = FP32 Vector = 48.7 TFLOPS (SIMD path); that vector value is NOT used here in favor of the matrix path which is the cross-vendor analog of NVIDIA tensor-core FP16. See policy in .claude/agents/gpu-researcher.md.'
  - 'int8TOPS of 389 and fp8TFLOPS of 389 are the peak INT8 Matrix (dense) and FP8 Matrix (dense, E5M2/E4M3) performance per the AMD official product page (https://www.amd.com/en/products/graphics/desktops/radeon/9000-series/amd-radeon-rx-9070xt.html), which also lists structured-sparsity values of 779 TOPS INT8 Matrix and 779 TFLOPS FP8 Matrix (2x dense). Both fields were previously missing from this file entirely; added during the Phase 5 precision-filters audit (2026-09-02) directly from AMD''s published compute specifications table. The dense fp8TFLOPS value equals both int8TOPS (389) and 2x fp16TFLOPS (194.8), consistent with AMD''s halving-bitwidth-doubles-throughput Matrix Core pattern confirmed across all six RDNA 4 SKUs audited this batch.'
  - 'supportedHardwareOperations updated to add FP8 (Phase 5 audit, 2026-09-02). AMD''s official product page publishes an FP8 Matrix performance row (389 TFLOPS dense) for the RX 9070 XT, confirming 2nd-generation AI Accelerator FP8 support is present on this SKU. FP8 was previously omitted from this file as a data-entry gap — it predates FP8 being checked against AMD''s spec table — not because the hardware lacks FP8. Direct verification this batch confirmed FP8 is published on AMD''s official product pages for all six RDNA 4 desktop/workstation SKUs, spanning both the Navi 48 die (this card, plus RX 9070 GRE/AI PRO R9700/RX 9070) and the Navi 44 die (RX 9060/RX 9060 XT), so FP8 WMMA support is architecture-wide (GFX12/RDNA 4), not die-specific. See the canonical RDNA 4 row in .claude/agents/gpu-researcher.md.'
  - 'fp4TFLOPS is intentionally omitted (not set to null-with-unverifiedSpecs) because no FP4 Matrix row is published on the AMD product page and no FP4 WMMA input format is documented in the RDNA4 Instruction Set Architecture Reference Guide. This is a confirmed hardware negative (RDNA 4 has no FP4 support), not a research gap, so unverifiedSpecs does not apply per project convention.'
  - Memory bandwidth calculated as 256-bit interface × 20 Gbps = 640 GB/s, enhanced by 64MB 3rd-generation Infinity Cache.
  - TDP is 304W, with some custom models featuring up to 330W power limits.
  - Process node is TSMC 4nm with Navi 48 XTX GPU die.
  - Clock speeds vary by model - reference specs show 2,400 MHz game clock and 2,970 MHz boost, while factory-overclocked models like XFX Mercury reach 3,100 MHz boost.
  - RDNA 4 introduces optimized Compute Units, 3rd-generation Ray Tracing accelerators, and 2nd-generation AI Accelerators.
  - FSR 4 is exclusive to RDNA 4 GPUs and leverages the AI accelerators for ML-based upscaling.
  - The RX 9070 XT competes directly with NVIDIA's RTX 4070 Ti and RTX 5070, offering competitive performance at a more attractive price point.
  - MSRP of $599 USD sourced from AMD official announcement per GSMArena and Tom's Hardware coverage.
