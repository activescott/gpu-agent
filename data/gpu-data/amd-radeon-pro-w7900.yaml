notes:
  - FP32 TFLOPS of 61 per AMD official specifications for peak single-precision performance
  - 'fp16TFLOPS of 122.0 represents FP16 Matrix throughput (dense) via RDNA 3 AI Accelerators (WMMA), per AMD product page convention. This equals 2x FP32 vector on RDNA 3 silicon. AMD also publishes FP16 Vector = FP32 Vector on the same product page; that SIMD path is NOT used here in favor of the matrix path which is the cross-vendor analog of NVIDIA tensor-core FP16. See policy in .claude/agents/gpu-researcher.md.'
  - tensorCoreCount of 192 represents the AI Accelerators (2 per compute unit x 96 compute units)
  - Memory bandwidth of 864 GB/s calculated as 384-bit bus x 18 Gbps effective / 8
  - RDNA 3 architecture includes dedicated AI Accelerators for machine learning workloads
  - Built on TSMC 5nm process with chiplet design featuring full Navi 31 GPU
  - Includes ECC memory support for professional applications requiring data integrity
  - MSRP of $3,999 USD sourced from AMD official press release dated January 4, 2023 at CES 2023
  - AMD Ordering Part Number (OPN) 100-300000049 sourced from retail listings
  - Released April 13, 2023 as AMD's flagship professional workstation GPU
  - Competes with NVIDIA RTX 6000 Ada Generation in the professional workstation segment
  - 'Phase 5 audit (2026-09-02): supportedHardwareOperations corrected from [FP16, FP32, BF16, INT8, INT4] to the canonical RDNA 3 set [FP16, BF16, INT8, INT4] per AMD GPUOpen, "How to accelerate AI applications on RDNA 3 using WMMA" (https://gpuopen.com/learn/wmma_on_rdna3/), which documents WMMA input formats on RDNA 3 Compute Units as FP16, BF16, and 8-bit/4-bit integer (IU8/IU4) only. FP32 was removed: it is a plain shader-ALU precision, not accelerated through the AI Accelerator/WMMA matrix path, matching the canonical RDNA 3 row in .claude/agents/gpu-researcher.md.'
  - 'fp8TFLOPS and fp4TFLOPS are left null as a confirmed hardware negative, not a missing-data gap: RDNA 3''s WMMA AI Accelerators support only FP16, BF16, and 8-bit/4-bit integer input formats per AMD GPUOpen (https://gpuopen.com/learn/wmma_on_rdna3/). FP8 support was added one generation later in RDNA 4, and no AMD consumer/prosumer GPU family has shipped FP4 matrix hardware to date. Per the not-found-marking rules in .claude/agents/gpu-researcher.md, this confirmed negative is NOT added to unverifiedSpecs.'
