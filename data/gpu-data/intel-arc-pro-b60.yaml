notes:
  - FP32 TFLOPS of 12.28 sourced directly from Intel's official product specifications page at intel.com.
  - FP16 TFLOPS of 24.58 sourced from third-party GPU databases (SiliconCat, CpuTronic) based on Xe2 architecture specifications. Intel does not publish FP16 performance in official specs, but the 2:1 ratio of FP16 to FP32 is consistent with Xe2 architecture documentation.
  - INT8 TOPS of 197 represents peak INT8 AI performance (Int8 Dense per Intel's official B60 datasheet) and is sourced directly from Intel's official product specifications.
  - Memory bandwidth calculated as 192-bit interface × 19 Gbps ÷ 8 bits/byte = 456 GB/s, confirmed by Intel official specifications.
  - TBP (Thermal Base Power) is 200W at 2400 MHz boost clock. Intel also specifies a low-power mode ranging from 120-200W at 2000 MHz.
  - XMX (Xe Matrix eXtension) engine count of 160 sourced from Intel official specifications. These are Intel's dedicated AI accelerators, equivalent to tensor cores in NVIDIA GPUs.
  - FP64 double precision performance is not officially published by Intel. Third-party sources report FP64 at 1:4 ratio to FP32 (approximately 3.07 TFLOPS), but this is unverified. FP64, when supported, runs on the general-purpose shader units (XVEs), not the XMX matrix engine, so it is not included in supportedHardwareOperations under the GEMM-only definition (see Phase 5 audit note below).
  - The GPU uses the BMG-G21 chip with 272mm² die size and 19.6 billion transistors, manufactured on TSMC's N5 (5nm) process.
  - MSRP of $599 USD based on retail pricing at launch from US retailer Central Computers for the ASRock Arc Pro B60 Creator 24GB. Intel did not officially publish MSRP but indicated an estimated value around $500 at Computex 2025 announcement.
  - Release date of September 19, 2025 based on multiple sources confirming the GPU launched in September 2025 with availability in North America. The GPU was announced at Computex 2025 in May 2025, with sampling to AIB partners beginning in June 2025.
  - Intel Product SKU 243916 sourced from Intel's official product page URL structure.
  - Device ID 0xE211 sourced from Intel's official specifications page and confirmed in Intel's compute-runtime GitHub repository.
  - AIB partners include ASRock, Gunnir, Lanner, Maxsun, Onix, Senao, and Sparkle. Specific part numbers for individual AIB products are not widely published yet, as most products were listed with model names only.
  - The GPU shares its silicon foundation (BMG-G21) with the gaming-focused Arc B580, both using the same die with 20 Xe2 cores. The critical differentiation is memory capacity (24GB vs 12GB) and market positioning.
  - Intel positions the Arc Pro B60 as delivering up to 3× faster performance compared to previous generation professional GPUs at this price point, with significantly better performance per dollar.
  - The GPU supports DirectX 12 Ultimate and OpenGL 4.6 APIs.
  - Intel's Project Battlematrix showcases dual-GPU and multi-GPU configurations, with systems featuring up to 8 Arc Pro B60 GPUs providing 192GB of combined VRAM for large-scale AI inference workloads.
  - 'Phase 5 precision audit (2026-09-02): supportedHardwareOperations corrected to FP16, BF16, INT8, INT4 (removed FP32, FP64, and TF32) per the canonical Xe2-HPG (Battlemage) supportedHardwareOperations definition in gpu-researcher.md. TF32 was a data-entry inconsistency: it is not listed anywhere in Intel''s official Arc Pro B60 datasheet or specifications page, is not present on the sibling B570/B580/Pro B50 files (same Xe2-HPG generation, same XMX design), and appears to have been over-applied from Intel''s generic oneAPI XMX documentation ("Intel XMX supports...int8, fp16, bf16, and tf32...depending on hardware generation") which describes TF32 support on the separate Xe-HPC (Ponte Vecchio / Data Center GPU Max Series) architecture, not Xe2/Battlemage. FP32 and FP64 were removed because this field is scoped to hardware-accelerated XMX matrix/tensor (GEMM) paths only; FP32/FP64 run on the general-purpose Xe Vector Engines (XVEs), per Intel VTune Profiler documentation which defines a dedicated XMX instruction-count metric scoped to FP16/BF16/INT8/INT4/INT2 only, distinct from a separate XVE metric covering INT16/INT32/INT64/FP16/FP32/FP64.'
  - 'fp8TFLOPS and fp4TFLOPS are intentionally omitted (not added to unverifiedSpecs) because this is a confirmed hardware negative, not a research gap: Intel''s official Arc Pro B60 datasheet (which does list "Int8 Dense" AI TOPS explicitly) and the B70 datasheet make no mention of FP8 or FP4 XMX data type support anywhere, and the chipsandcheese Battlemage architecture analysis likewise documents no FP8/FP4 XMX support for the Xe2/Xe2-HPG generation.'
  - 'gpuArchitecture changed from "Xe2" to "Xe2-HPG (Battlemage)" during the 2026-09-02 audit to normalize naming across all six Arc B/Pro B-series files. Intel''s own official Arc Pro B60 datasheet (PDF one-pager, download.intel.com/newsroom/2025/client-computing/Intel-Arc-Pro-B60-Data-Sheet.pdf) explicitly labels its Xe-cores "20 Xe2-HPG" in the Specifications table, confirming Intel itself uses the "Xe2-HPG" designation for this Pro-tier product, not just consumer B570/B580. No genuine hardware-based Pro-vs-consumer naming split was found; both tiers share the same Xe2-HPG/Battlemage generation and BMG-G21 die.'
